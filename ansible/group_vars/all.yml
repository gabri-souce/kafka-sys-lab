---
# ───────────────────────────────────────────────────────────
# VERSIONI E DISTRIBUZIONE
# ───────────────────────────────────────────────────────────
kafka_version: "3.7.0"
scala_version: "2.13"
kafka_dist: "kafka_{{ scala_version }}-{{ kafka_version }}"
install_dir: "/opt/kafka"
kafka_user: "kafka"
java_package: "java-17-openjdk-devel"

# ───────────────────────────────────────────────────────────
# PERCORSI DATI E STORAGE (LVM/RHCSA)
# ───────────────────────────────────────────────────────────
# Nota: kafka_data_dir verrà montata sul volume LVM /dev/nvme0n2
zookeeper_data_dir: "/var/lib/zookeeper"
kafka_data_dir: "/var/lib/kafka/data"

# ───────────────────────────────────────────────────────────
# NETWORKING E QUORUM
# ───────────────────────────────────────────────────────────
zookeeper_hosts: "kafka-1:2181,kafka-2:2181,kafka-3:2181"

# ───────────────────────────────────────────────────────────
# SICUREZZA SASL: CREDENZIALI (Utilizzate nei template JAAS)
# ───────────────────────────────────────────────────────────
admin_user: "admin"
admin_password: "admin-password"

producer_user: "producer"
producer_password: "prod-pass"

consumer_user: "consumer"
consumer_password: "cons-pass"

# ───────────────────────────────────────────────────────────
# GESTIONE TOPIC (GITOPS)
# ───────────────────────────────────────────────────────────
kafka_topics_list:
  - name: "ordini-clienti"
    partitions: 3
    retention_ms: "604800000" # 7 giorni
  - name: "notifiche-app"
    partitions: 3
    retention_ms: "86400000"  # 1 giorno

# ───────────────────────────────────────────────────────────
# SICUREZZA SCALABILE: ACL CON PREFISSO
# ───────────────────────────────────────────────────────────
# Definisce i permessi per intere categorie di topic
kafka_acl_prefixes:
  - { prefix: 'ordini-', producer: 'producer', consumer: 'consumer' }
  - { prefix: 'notifiche-', producer: 'producer', consumer: 'consumer' }